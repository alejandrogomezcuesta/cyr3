site_name: Computación y Robótica 3
site_description: Cyr 3º ESO
site_url: https://alejandrogomezcuesta.github.io/cyr3/
repo_url: https://github.com/alejandrogomezcuesta/cyr3
repo_name: alejandrogomezcuesta/cyr3
site_dir: site
docs_dir: docs
strict: true

theme:
  name: material
  language: es
  features:
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select 
    - content.code.annotate
    - toc.follow
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro

plugins:
  - search:
      lang:
        - es

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.esm.min.mjs

nav:
  - Inicio: index.md
  - Tema 1. Introducción a la programación:
      - Presentación: tema1/index.md
      - Leer código solo con números:
          - Ejercicios: tema1/01-leer-codigo-solo-numeros-ejercicios.md
          - Soluciones: tema1/01s-leer-codigo-solo-numeros-ejercicios-soluciones.md
          - Retos: tema1/02-leer-codigo-solo-numeros-retos.md
          - Soluciones de los retos: tema1/02s-leer-codigo-solo-numeros-retos-soluciones.md
      - Bucles y condiciones:
          - Ejercicios: tema1/03-leer-codigo-solo-numeros-bucles-y-condiciones.md
          - Soluciones: tema1/03s-leer-codigo-solo-numeros-bucles-y-condiciones-soluciones.md
          - Retos: tema1/04-leer-codigo-solo-numeros-retos.md
          - Soluciones de los retos: tema1/04s-leer-codigo-solo-numeros-retos-soluciones.md
      - Acumuladores:
          - Ejercicios: tema1/05-leer-codigo-solo-numeros-acumuladores.md
          - Soluciones: tema1/05s-leer-codigo-solo-numeros-acumuladores-solución.md
          - Retos: tema1/06-leer-codigo-solo-numeros-acumuladores-retos.md
          - Soluciones de los retos: tema1/06s-leer-codigo-solo-numeros-acumuladores-retos-solución.md
      - Ejercicios de examen:
          # - Modelo general: tema1/07-ejercicios-de-examen.md
          - Modelo de examen A: tema1/07a-ejercicios-examen.md
          # - Modelo B: tema1/07b-ejercicios-examen.md
          # - Soluciones: tema1/07s-ejercicios-de-examen.md
  - Tema 2. Desarrollo móvil:
      - Presentación: tema2/index.md
      - 01 Introducción a Thunkable: tema2/01-intro-hola-mundo.md
      - 02 App que suma dos números: tema2/02-sumar-dos-numeros.md
      - 03 Memes Shake: tema2/03-memes-shake.md
      - 04 App de incidencias para la Policía: tema2/04-app-policia.md
      - 05 Un nivel con Thunkable: tema2/05-acelerometro-nivel.md
      # - Brújula: tema2/06-giroscopio-brujula.md
      # - Práctica: la flecha que te sigue: tema2/06-giroscopio-hablando.md
      # - Piano: tema2/08-piano.md.
